[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opengonsult"
dynamic = ["version"]
description = "Nissan CONSULT-I diagnostic suite for Linux (GTK4)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "OpenGonsult Maintainers", email = "OpenGonsult@users.noreply.github.com" },
]
requires-python = ">=3.8"
keywords = ["nissan", "consult", "diagnostic", "obd", "gtk4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "PyGObject>=3.42",
    "pycairo>=1.20",
    "pyserial>=3.5",
]

[project.scripts]
opengonsult = "gui.main_window:main"

[tool.setuptools]
packages = [
    "dashboard",
    "ecu",
    "graphs",
    "gui",
    "protocol",
    "serial",
    "sessionrec",
]

[tool.setuptools.dynamic]
version = { attr = "gui.__version__" }