[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opengonsult"
dynamic = ["version"]
description = "Nissan CONSULT-I diagnostic suite for Linux (GTK4)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "OpenGonsult Maintainers", email = "OpenGonsult@users.noreply.github.com" },
]
requires-python = ">=3.8"
keywords = ["nissan", "consult", "diagnostic", "obd", "gtk4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "PyGObject>=3.42",
    "pycairo>=1.20",
    "pyserial>=3.5",
]

[project.scripts]
opengonsult = "gui.main_window:main"

[tool.setuptools]
packages = [
    "dashboard",
    "ecu",
    "graphs",
    "gui",
    "protocol",
    "serial",
    "sessionrec",
]

[tool.setuptools.dynamic]
version = { attr = "gui.__version__" }

[tool.ruff]
target-version = "py38"
line-length = 100
# debian-build is a packaging staging tree mirrored from live source; it is
# not linted directly (it duplicates the packages under test/lint).
extend-exclude = ["debian-build/", "orchestrator/", "docs/", "examples/"]

[tool.ruff.lint]
# Bug-risk rules: pycodestyle errors (E4/E7/E9) + pyflakes (F).
select = ["E4", "E7", "E9", "F"]

# E402 is intended/wanted here: gi.require_version() must run before the
# gi.repository import, and the version import intentionally sits among
# module constants (PYTHONPATH-based dev layout).
[tool.ruff.lint.per-file-ignores]
"dashboard/gauges.py" = ["E402"]
"graphs/sensor_graph.py" = ["E402"]
"gui/main_window.py" = ["E402"]
# Tests must inject sys.path and mock gi/cairo before importing the modules
# under test, so module-level imports intentionally sit below that setup.
"tests/*" = ["E402"]